spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

trading.symbols=AAPL,GOOGL,MSFT
trading.strategy.fade.enabled=true
trading.strategy.fade.window=14
trading.strategy.fade.z-threshold=2.0
trading.strategy.ppo.enabled=true

trading.risk.per-order-fraction=0.01
trading.risk.max-position-per-symbol=100
trading.risk.max-gross-exposure=0.5
trading.risk.daily-loss-limit=1000
trading.risk.confidence-threshold=0.55
trading.risk.flatten-on-kill=false
