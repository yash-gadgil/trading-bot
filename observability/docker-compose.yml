services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: tradingbot-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: tradingbot
      POSTGRES_USER: tradingbot
      POSTGRES_PASSWORD: tradingbot
      TS_TUNE_MEMORY: 1GB
      TS_TUNE_NUM_CPUS: 2
    ports:
      - "5432:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingbot -d tradingbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tradingbot-app
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: metrics
      TRADINGBOT_DB_URL: jdbc:postgresql://timescaledb:5432/tradingbot
      TRADINGBOT_DB_USER: tradingbot
      TRADINGBOT_DB_PASSWORD: tradingbot

  grafana:
    image: grafana/grafana:11.4.0
    container_name: tradingbot-grafana
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  timescaledb-data:
  grafana-data:
